name: Build and Push Eval Runner Image

on:
  push:
    tags:
      - '*'
    branches:
      # - main
      - deep-agent
  workflow_dispatch:  # Allow manual trigger for testing

permissions:
  contents: write
  packages: write
  security-events: write
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-eval
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix={{branch}}-,enable=${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Extract version for deployment package
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="${GITHUB_REF#refs/heads/}-${GITHUB_SHA::7}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "package_name=eval-runner-deployment.zip" >> $GITHUB_OUTPUT

      - name: Build image locally for scanning
        uses: docker/build-push-action@v5
        with:
          context: ./eval-runner
          file: ./eval-runner/Containerfile
          push: false
          load: true
          tags: scan-target-eval:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scan-target-eval:${{ steps.version.outputs.version }}
          format: table
          severity: CRITICAL,HIGH
          scanners: vuln
          trivyignores: .trivyignore
          exit-code: '1'

      - name: Generate Trivy JSON report
        if: always()
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scan-target-eval:${{ steps.version.outputs.version }}
          format: json
          output: trivy-report-eval.json
          scanners: vuln
          exit-code: '0'

      - name: Generate SBOM
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scan-target-eval:${{ steps.version.outputs.version }}
          format: cyclonedx
          output: sbom-eval.cdx.json
          scanners: vuln
          exit-code: '0'

      - name: Upload SBOM
        if: always() && hashFiles('sbom-eval.cdx.json') != ''
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-eval-${{ steps.version.outputs.version }}
          path: sbom-eval.cdx.json
          retention-days: 90

      - name: Generate SARIF report
        if: always()
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scan-target-eval:${{ steps.version.outputs.version }}
          format: sarif
          output: trivy-results-eval.sarif
          scanners: vuln
          exit-code: '0'

      - name: Upload Trivy scan results to GitHub Security tab
        if: always() && hashFiles('trivy-results-eval.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results-eval.sarif

      - name: Upload Trivy report as artifact
        if: always() && hashFiles('trivy-results-eval.sarif') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-report-eval-${{ steps.version.outputs.version }}
          path: trivy-results-eval.sarif
          retention-days: 30

      - name: Push multi-platform image
        id: push
        uses: docker/build-push-action@v5
        with:
          context: ./eval-runner
          file: ./eval-runner/Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Update last-good-eval repo variables
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh variable set LAST_GOOD_EVAL_IMAGE \
            --body "ghcr.io/${{ github.repository }}-eval:${{ steps.version.outputs.version }}" \
            --repo ${{ github.repository }}
          gh variable set LAST_GOOD_EVAL_DIGEST \
            --body "${{ steps.push.outputs.digest }}" \
            --repo ${{ github.repository }}
          gh variable set LAST_GOOD_EVAL_SHA \
            --body "${{ github.sha }}" \
            --repo ${{ github.repository }}

      - name: Create deployment package metadata
        run: |
          cat > eval-runner/deployment/release-info.json <<EOF
          {
            "version": "${{ steps.version.outputs.version }}",
            "git_ref": "${{ github.ref }}",
            "git_sha": "${{ github.sha }}",
            "build_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "container_image": "ghcr.io/${{ github.repository }}-eval:${{ steps.version.outputs.version }}",
            "container_digest": "${{ steps.push.outputs.digest }}",
            "repository": "${{ github.repository }}"
          }
          EOF
          cat eval-runner/deployment/release-info.json

      - name: Create deployment package
        run: |
          cd eval-runner/deployment
          zip -r ../../${{ steps.version.outputs.package_name }} . -x "*.git*"
          cd ../..
          echo "Created package: ${{ steps.version.outputs.package_name }}"
          ls -lh ${{ steps.version.outputs.package_name }}

      - name: Generate checksums
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          FILES="${{ steps.version.outputs.package_name }}"
          [ -f sbom-eval.cdx.json ] && FILES="$FILES sbom-eval.cdx.json"
          [ -f trivy-report-eval.json ] && FILES="$FILES trivy-report-eval.json"
          sha256sum $FILES > SHA256SUMS-eval.txt
          cat SHA256SUMS-eval.txt

      - name: Create GitHub Release (for tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          files: |
            ${{ steps.version.outputs.package_name }}
            SHA256SUMS-eval.txt
            sbom-eval.cdx.json
            trivy-report-eval.json
          body: |
            ## Eval Runner Image

            ```bash
            docker pull ghcr.io/${{ github.repository }}-eval:${{ steps.version.outputs.version }}
            ```

            **Digest:** `${{ steps.push.outputs.digest }}`

            ## Artifacts

            | File | Description |
            |------|-------------|
            | `eval-runner-deployment.zip` | Eval runner deployment manifests |
            | `sbom-eval.cdx.json` | CycloneDX SBOM for eval runner |
            | `trivy-report-eval.json` | Vulnerability scan results |
            | `SHA256SUMS-eval.txt` | SHA-256 checksums for eval artifacts |
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload deployment package as artifact (for branch builds)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.version.outputs.package_name }}
          path: ${{ steps.version.outputs.package_name }}
          retention-days: 30

      - name: Build summary
        run: |
          echo "### Eval Runner Image Built Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${{ steps.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Container Image Tags:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Pull command:**" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "docker pull ghcr.io/${{ github.repository }}-eval:${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Deployment Package:**" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "📦 \`${{ steps.version.outputs.package_name }}\` attached to release" >> $GITHUB_STEP_SUMMARY
          else
            echo "📦 \`${{ steps.version.outputs.package_name }}\` uploaded as workflow artifact" >> $GITHUB_STEP_SUMMARY
          fi
