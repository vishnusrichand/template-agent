name: Package Release

# Triggered when the agent build completes.
# Agent success = gate. Eval is waited on; uses last good on failure.
on:
  workflow_run:
    workflows: ["Build and Push Base Image"]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  package:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout at agent build commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Determine build context
        id: ctx
        run: |
          HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
          HEAD_BRANCH="${{ github.event.workflow_run.head_branch }}"
          SHORT_SHA="${HEAD_SHA::7}"
          if git tag --points-at "$HEAD_SHA" | grep -qE '^v?[0-9]+\.[0-9]+'; then
            TAG=$(git tag --points-at "$HEAD_SHA" | grep -E '^v?[0-9]+\.[0-9]+' | head -1)
            echo "is_tag=true"         >> $GITHUB_OUTPUT
            echo "version=${TAG}"      >> $GITHUB_OUTPUT
          else
            echo "is_tag=false"                               >> $GITHUB_OUTPUT
            echo "version=${HEAD_BRANCH}-${SHORT_SHA}"       >> $GITHUB_OUTPUT
          fi
          echo "head_sha=${HEAD_SHA}"     >> $GITHUB_OUTPUT
          echo "head_branch=${HEAD_BRANCH}" >> $GITHUB_OUTPUT

      - name: Download agent artifact from this run
        uses: actions/download-artifact@v4
        with:
          name: last-good-agent
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: agent-info

      - name: Read agent info
        id: agent
        run: |
          cat agent-info/last-good-agent.json
          echo "image=$(jq -r '.container_image' agent-info/last-good-agent.json)"  >> $GITHUB_OUTPUT
          echo "digest=$(jq -r '.container_digest' agent-info/last-good-agent.json)" >> $GITHUB_OUTPUT
          echo "signed=$(jq -r '.signed' agent-info/last-good-agent.json)"           >> $GITHUB_OUTPUT

      - name: Wait for eval workflow on same commit
        id: eval-wait
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
          TIMEOUT=1800
          INTERVAL=30
          ELAPSED=0
          echo "Waiting for eval workflow on commit ${HEAD_SHA}..."
          while [ $ELAPSED -lt $TIMEOUT ]; do
            RUN=$(gh api \
              "repos/${{ github.repository }}/actions/workflows/build-eval-image.yml/runs?head_sha=${HEAD_SHA}&per_page=1" \
              --jq '.workflow_runs[0] | {id: .id, status: .status, conclusion: .conclusion}' 2>/dev/null || echo "null")
            if [ "$RUN" != "null" ] && [ -n "$RUN" ]; then
              STATUS=$(echo "$RUN" | jq -r '.status')
              CONCLUSION=$(echo "$RUN" | jq -r '.conclusion')
              RUN_ID=$(echo "$RUN" | jq -r '.id')
              echo "Eval run ${RUN_ID}: status=${STATUS} conclusion=${CONCLUSION}"
              if [ "$STATUS" = "completed" ]; then
                echo "conclusion=${CONCLUSION}" >> $GITHUB_OUTPUT
                echo "run_id=${RUN_ID}"         >> $GITHUB_OUTPUT
                exit 0
              fi
            fi
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done
          echo "::warning::Eval timed out — using last good eval artifact"
          echo "conclusion=timed_out" >> $GITHUB_OUTPUT
          echo "run_id="              >> $GITHUB_OUTPUT

      - name: Find last good eval run id
        id: eval-run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CONCLUSION="${{ steps.eval-wait.outputs.conclusion }}"
          CURRENT_RUN_ID="${{ steps.eval-wait.outputs.run_id }}"

          if [ "$CONCLUSION" = "success" ]; then
            echo "run_id=${CURRENT_RUN_ID}" >> $GITHUB_OUTPUT
            echo "is_current=true"          >> $GITHUB_OUTPUT
          else
            # Find last successful eval run that has the artifact
            LAST_RUN_ID=$(gh api \
              "repos/${{ github.repository }}/actions/workflows/build-eval-image.yml/runs?branch=${{ steps.ctx.outputs.head_branch }}&status=success&per_page=10" \
              --jq "[.workflow_runs[] | select(.id != ${CURRENT_RUN_ID:-0})] | .[0].id")
            echo "run_id=${LAST_RUN_ID}" >> $GITHUB_OUTPUT
            echo "is_current=false"      >> $GITHUB_OUTPUT
          fi

      - name: Download eval artifact
        id: eval-download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: last-good-eval
          run-id: ${{ steps.eval-run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: eval-info

      - name: Read eval info
        id: eval
        run: |
          if [ ! -f eval-info/last-good-eval.json ]; then
            echo "::warning::No eval artifact found — eval info will be empty"
            echo "image="          >> $GITHUB_OUTPUT
            echo "digest="         >> $GITHUB_OUTPUT
            echo "sha="            >> $GITHUB_OUTPUT
            echo "is_current=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          cat eval-info/last-good-eval.json
          echo "image=$(jq -r '.container_image' eval-info/last-good-eval.json)"   >> $GITHUB_OUTPUT
          echo "digest=$(jq -r '.container_digest' eval-info/last-good-eval.json)"  >> $GITHUB_OUTPUT
          echo "sha=$(jq -r '.git_sha' eval-info/last-good-eval.json)"              >> $GITHUB_OUTPUT
          echo "is_current=${{ steps.eval-run.outputs.is_current }}"                >> $GITHUB_OUTPUT

      - name: Create combined release-info.json
        run: |
          mkdir -p deployment
          cat > deployment/release-info.json <<EOF
          {
            "version": "${{ steps.ctx.outputs.version }}",
            "git_ref": "${{ github.event.workflow_run.head_branch }}",
            "git_sha": "${{ steps.ctx.outputs.head_sha }}",
            "build_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "agent": {
              "container_image": "${{ steps.agent.outputs.image }}",
              "container_digest": "${{ steps.agent.outputs.digest }}",
              "signed": ${{ steps.agent.outputs.signed }}
            },
            "eval_runner": {
              "container_image": "${{ steps.eval.outputs.image }}",
              "container_digest": "${{ steps.eval.outputs.digest }}",
              "git_sha": "${{ steps.eval.outputs.sha }}",
              "is_current_commit": ${{ steps.eval.outputs.is_current || false }}
            }
          }
          EOF
          cat deployment/release-info.json

      - name: Create deployment package
        run: |
          cd deployment
          zip -r ../deployment.zip . -x "*.git*"
          cd ..
          sha256sum deployment.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload combined package as artifact (branch builds)
        if: steps.ctx.outputs.is_tag == 'false'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-package-${{ steps.ctx.outputs.version }}
          path: |
            deployment.zip
            SHA256SUMS.txt
          retention-days: 30

      - name: Create GitHub Release (tags only)
        if: steps.ctx.outputs.is_tag == 'true'
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          tag_name: ${{ steps.ctx.outputs.version }}
          files: |
            deployment.zip
            SHA256SUMS.txt
          body: |
            ## Agent Image

            ```bash
            docker pull ${{ steps.agent.outputs.image }}
            ```

            **Digest:** `${{ steps.agent.outputs.digest }}`
            **Signed:** ${{ steps.agent.outputs.signed == 'true' && 'Yes' || 'No' }}

            ## Eval Runner Image${{ steps.eval.outputs.is_current != 'true' && ' ⚠️ previous successful build' || '' }}

            ```bash
            docker pull ${{ steps.eval.outputs.image }}
            ```

            **Digest:** `${{ steps.eval.outputs.digest }}`
            ${{ steps.eval.outputs.is_current != 'true' && format('> Built from commit `{0}` — eval build failed or timed out on this release commit.', steps.eval.outputs.sha) || '> Built from this release commit.' }}

            ## Artifacts

            | File | Description |
            |------|-------------|
            | `deployment.zip` | Deployment manifests with agent + eval image references |
            | `SHA256SUMS.txt` | SHA-256 checksums |
          draft: false
          prerelease: ${{ contains(steps.ctx.outputs.version, 'alpha') || contains(steps.ctx.outputs.version, 'beta') || contains(steps.ctx.outputs.version, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
